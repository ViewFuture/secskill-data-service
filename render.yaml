# Render Blueprint for SecSkill_Data_Service
# Docs: https://render.com/docs/blueprint-spec
# Secrets use sync:false — set them in the Render Dashboard.
# No database / no persistent disk.

services:
  - type: web
    name: secskill-data-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PLUGIN_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SOURCE_FILE
        value: sources.json
      - key: DEMO_FILE
        value: fixtures/jobs.json
      - key: REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: JOB_PROVIDER
        value: mcp_jobs
      - key: MCP_JOBS_ENABLED
        value: "true"
      - key: MCP_JOBS_BASE_URL
        value: https://secskill-mcp-jobs-adapter.onrender.com
      - key: MCP_JOBS_TOKEN
        sync: false
      - key: MCP_JOBS_TIMEOUT_SECONDS
        value: "180"
      - key: MCP_JOBS_FALLBACK_TO_DEMO
        value: "true"
      - key: MCP_JOBS_PAGE
        value: "1"
      - key: DATE_FILTER_MODE
        value: soft
