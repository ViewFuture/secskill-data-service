# Render Blueprint for SecSkill_Data_Service
# Docs: https://render.com/docs/blueprint-spec
# Secrets use sync:false — set them in the Render Dashboard.
# No database / no persistent disk.

services:
  - type: web
    name: secskill-data-service
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PLUGIN_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SOURCE_FILE
        value: sources.json
      - key: DEMO_FILE
        value: fixtures/jobs.json
      - key: REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: JOB_PROVIDER
        value: mcp_jobs
      - key: MCP_JOBS_ENABLED
        value: "true"
      - key: MCP_JOBS_BASE_URL
        value: https://secskill-mcp-jobs-adapter.onrender.com
      - key: MCP_JOBS_TOKEN
        sync: false
      - key: MCP_JOBS_TIMEOUT_SECONDS
        value: "180"
      - key: MCP_JOBS_FALLBACK_TO_DEMO
        value: "true"
      - key: MCP_JOBS_PAGE
        value: "1"
      - key: DATE_FILTER_MODE
        value: soft
      - key: LIEPIN_USER_TOKEN
        sync: false
      - key: LIEPIN_PYTHON_EXECUTABLE
        value: ".liepin-venv/bin/python"
      - key: LIEPIN_CLI_TIMEOUT_SECONDS
        value: "45"
      - key: LIEPIN_MAX_CONCURRENT
        value: "1"
      - key: LIEPIN_MAX_KEYWORDS
        value: "3"
      - key: LIEPIN_MAX_PAGES
        value: "1"
      - key: LIEPIN_MAX_ITEMS_LIMIT
        value: "60"
      - key: LIEPIN_CACHE_TTL_SECONDS
        value: "600"
      - key: LIEPIN_OUTPUT_MAX_BYTES
        value: "2000000"
      - key: LIEPIN_CLI_COMMIT
        value: "858a62bd839d490e8745b7503961e4676a54b9d7"
      - key: LIEPIN_FALLBACK_TO_SNAPSHOT
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
